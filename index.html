
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محمل الفيديوهات</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#0b1020;
 color:white;
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
}
.container{
 width:100%;
 max-width:480px;
 background:#151d32;
 padding:25px;
 border-radius:22px;
 box-shadow:0 10px 40px #0006;
}
.logo{
 font-size:45px;
 text-align:center;
}
h1{text-align:center;margin:10px 0}
.desc{text-align:center;color:#aab4cc;font-size:14px}
label{display:block;margin:18px 0 8px}
input,select{
 width:100%;
 padding:15px;
 border-radius:12px;
 border:1px solid #34415e;
 background:#0d1528;
 color:white;
 font-size:15px;
 outline:none;
}
button{
 width:100%;
 padding:15px;
 border:0;
 border-radius:12px;
 background:linear-gradient(90deg,#ff6b35,#ff9d42);
 color:white;
 font-size:17px;
 font-weight:bold;
 margin-top:18px;
 cursor:pointer;
}
button:active{transform:scale(.98)}
.preview{
 display:none;
 margin-top:20px;
 background:#0d1528;
 padding:12px;
 border-radius:15px;
 text-align:center;
}
.preview img{
 width:100%;
 border-radius:12px;
}
.message{
 margin-top:15px;
 padding:12px;
 border-radius:10px;
 background:#202d47;
 color:#d9e4ff;
 text-align:center;
 line-height:1.7;
 font-size:14px;
}
.footer{
 text-align:center;
 color:#8995ae;
 font-size:12px;
 margin-top:22px;
}
</style>
</head>

<body>
<div class="container">

<div class="logo">📥</div>
<h1>محمل الفيديوهات</h1>
<p class="desc">أدخل رابط الفيديو لعرض المعاينة</p>

<label>رابط الفيديو</label>
<input id="videoUrl" type="url" placeholder="ضع رابط الفيديو هنا">

<label>صيغة الملف</label>
<select id="format">
<option value="mp4">MP4 - فيديو</option>
<option value="mp3">MP3 - صوت</option>
</select>

<button onclick="analyzeVideo()">تحليل الرابط</button>

<div class="preview" id="preview">
<img id="thumbnail" alt="معاينة الفيديو">
<h3 id="videoTitle">معاينة الفيديو</h3>
</div>

<div class="message" id="message">
اختر رابط الفيديو واضغط تحليل الرابط.
</div>

<div class="footer">
أداة مجانية لعرض معاينة روابط الفيديو
</div>

</div>

<script>
function analyzeVideo(){

 const url=document.getElementById("videoUrl").value.trim();
 const preview=document.getElementById("preview");
 const message=document.getElementById("message");
 const thumbnail=document.getElementById("thumbnail");
 const title=document.getElementById("videoTitle");

 preview.style.display="none";

 if(!url){
  message.textContent="يرجى إدخال رابط الفيديو أولاً.";
  return;
 }

 let videoId=null;

 try{
  const parsed=new URL(url);
  const host=parsed.hostname.replace(/^www\./,"");

  if(host==="youtu.be"){
   videoId=parsed.pathname.split("/")[1];
  }

  if(host==="youtube.com" || host==="m.youtube.com"){
   videoId=parsed.searchParams.get("v");

   if(!videoId){
    const parts=parsed.pathname.split("/");
    const index=parts.findIndex(p=>p==="embed" || p==="shorts");
    if(index!==-1) videoId=parts[index+1];
   }
  }

 }catch(e){
  message.textContent="الرابط غير صحيح. تأكد من نسخه بشكل صحيح.";
  return;
 }

 if(videoId && /^[a-zA-Z0-9_-]{11}$/.test(videoId)){
  thumbnail.src="https://i.ytimg.com/vi/"+videoId+"/hqdefault.jpg";
  title.textContent="معاينة فيديو YouTube";
  preview.style.display="block";

  message.textContent=
   "تم التعرف على رابط الفيديو بنجاح. هذه معاينة فقط؛ تنزيل MP3 أو MP4 يحتاج إلى خادم معالجة خارجي.";
  return;
 }

 if(url.includes("facebook.com") || url.includes("fb.watch")){
  message.textContent=
   "تم إدخال رابط Facebook. عرض المعاينة والتنزيل يحتاج إلى ربط خدمة معالجة خارجية.";
  return;
 }

 message.textContent=
  "لم نتمكن من التعرف على المنصة. جرّب رابط YouTube أو Facebook.";
}
</script>

</body>
</html>
