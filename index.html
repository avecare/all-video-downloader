<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AveCare - محول الفيديو والصوت</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(145deg, #071426, #102b46);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: #10243a;
      border: 1px solid #29445e;
      border-radius: 22px;
      padding: 30px 22px;
      box-shadow: 0 15px 45px #0005;
    }

    .logo {
      text-align: center;
      font-size: 35px;
      font-weight: bold;
      color: #ff9d36;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      margin: 10px 0;
    }

    .subtitle {
      text-align: center;
      color: #a9bdce;
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.8;
    }

    label {
      display: block;
      margin: 17px 0 9px;
      font-size: 14px;
      color: #d8e5ef;
    }

    input, select {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #38536c;
      background: #081a2b;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #ff9d36;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #ff8b25, #ffb34d);
      color: #142236;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #081a2b;
      text-align: center;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    #downloadLink {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #168653;
      color: white;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
    }

    .note {
      color: #91a9bc;
      font-size: 12px;
      text-align: center;
      margin-top: 22px;
      line-height: 1.8;
    }

    footer {
      text-align: center;
      color: #7891a7;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="logo">AveCare</div>

    <h1>محول الفيديو والصوت</h1>

    <p class="subtitle">
      حوّل ملفات الفيديو والصوت بسهولة إلى الصيغة التي تريدها
    </p>

    <form id="convertForm">

      <label for="videoUrl">رابط الملف المباشر</label>
      <input
        id="videoUrl"
        type="url"
        placeholder="https://example.com/video.mp4"
        required
      >

      <label for="format">اختر صيغة التحويل</label>
      <select id="format">
        <option value="mp3">MP3 - صوت</option>
        <option value="mp4">MP4 - فيديو</option>
      </select>

      <button id="convertButton" type="submit">
        ابدأ التحويل
      </button>

    </form>

    <div id="message" role="status"></div>

    <a id="downloadLink" target="_blank" rel="noopener">
      تحميل الملف الناتج
    </a>

    <p class="note">
      يجب استخدام رابط مباشر لملف تملكه أو لديك إذن باستخدامه.
      لا تدعم الأداة روابط صفحات يوتيوب أو فيسبوك.
    </p>

    <footer>
      © 2026 AveCare - جميع الحقوق محفوظة
    </footer>

  </main>

  <script>
    const API_URL =
      "https://all-video-downloader.alamrat2026.workers.dev";

    const form = document.getElementById("convertForm");
    const urlInput = document.getElementById("videoUrl");
    const formatInput = document.getElementById("format");
    const button = document.getElementById("convertButton");
    const message = document.getElementById("message");
    const downloadLink = document.getElementById("downloadLink");

    function showMessage(text) {
      message.style.display = "block";
      message.textContent = text;
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function checkStatus(jobId) {
      for (let i = 0; i < 90; i++) {
        await sleep(3000);

        const response = await fetch(
          API_URL + "/api/status?id=" + encodeURIComponent(jobId)
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "تعذر متابعة التحويل");
        }

        if (data.status === "finished" && data.downloadUrl) {
          return data;
        }

        if (data.status === "error") {
          throw new Error(data.error || "فشل التحويل");
        }

        showMessage("⏳ جاري تحويل الملف... يرجى الانتظار");
      }

      throw new Error("استغرق التحويل وقتاً طويلاً، حاول مرة أخرى.");
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const url = urlInput.value.trim();
      const format = formatInput.value;

      button.disabled = true;
      button.textContent = "جاري التحويل...";
      downloadLink.style.display = "none";

      try {
        showMessage("⏳ جاري إرسال الملف للتحويل...");

        const response = await fetch(API_URL + "/api/convert", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            url: url,
            format: format
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "تعذر بدء التحويل");
        }

        showMessage("⏳ تم استلام الطلب. جاري معالجة الملف...");

        const result = await checkStatus(data.jobId);

        downloadLink.href = result.downloadUrl;
        downloadLink.download = result.filename || "converted-file";
        downloadLink.style.display = "block";

        showMessage("✅ اكتمل التحويل بنجاح!");

        button.textContent = "تحويل ملف آخر";

      } catch (error) {
        showMessage("❌ " + error.message);
        button.textContent = "إعادة المحاولة";
      } finally {
        button.disabled = false;
      }
    });
  </script>

</body>
</html>
